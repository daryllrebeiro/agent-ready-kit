name: AgentReady CI/CD Production Quality Gates

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-security-gate:
    name: Test & Security Audit Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint Gate (ruff, touched files)
        run: |
          ruff check packages/core/version.py packages/core/scorer.py packages/core/checks/bot_permissions.py packages/core/storage/migration.py packages/core/storage/postgres_rls.py packages/core/probes/pipeline.py packages/core/auth/middleware.py packages/core/auth/keys.py packages/core/storage/db.py packages/core/observability/health.py packages/mcp/server.py packages/cli/auth.py apps/web/server.py apps/worker/runner.py tests/test_m1_hardening.py tests/test_mcp.py tests/test_mcp_hardening.py tests/test_auth_middleware.py tests/test_postgres_rls.py tests/test_e2e_launch_matrix.py
          ruff format --check packages/core/version.py packages/core/scorer.py packages/core/checks/bot_permissions.py packages/core/storage/migration.py packages/core/storage/postgres_rls.py packages/core/probes/pipeline.py apps/web/server.py apps/worker/runner.py

      - name: Run Secret Scanning Security Gate
        run: |
          python -m packages.core.security.scanner

      - name: Execute Default Pytest Lane (fast)
        run: |
          pytest tests/ -q -m "not slow" --cov=packages --cov-fail-under=0

  slow-suite:
    name: Slow Suite (chaos / load / benchmarks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'
      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Execute Slow Pytest Lane
        run: |
          pytest tests/test_load_chaos_harness.py tests/test_benchmarks.py -q
