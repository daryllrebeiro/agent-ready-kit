name: AgentReady CI/CD Production Quality Gates

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-security-gate:
    name: Test & Security Audit Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint Gate (ruff, whole tree)
        run: |
          ruff check packages apps tests
          ruff format --check packages apps

      - name: Type Gate (mypy on packages/core)
        run: |
          python -m mypy packages/core --ignore-missing-imports

      - name: Run Secret Scanning Security Gate
        run: |
          python -m packages.core.security.scanner

      - name: Execute Default Pytest Lane (fast, coverage floor on core)
        run: |
          pytest tests/ -q -m "not slow" --cov=packages/core --cov-fail-under=80

  slow-suite:
    name: Slow Suite (chaos / load / benchmarks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'
      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Execute Slow Pytest Lane
        run: |
          pytest tests/test_load_chaos_harness.py tests/test_benchmarks.py -q
