[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentready"
version = "0.1.0"
description = "The missing layer between your website and AI agents - readiness scoring, citation tracking, and generator tools."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AgentReady Team" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
agentready = "packages.cli.main:cli_entrypoint"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
